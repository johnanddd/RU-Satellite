<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07111f"
    >

    <title>
        {% block title %}
        RU Satellite
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

    <div class="page-shell">

        <header class="site-header">

            <div class="site-header-inner">

                <a
                    href="/"
                    class="brand"
                >
                    <span class="brand-icon">
                        🛰️
                    </span>

                    <span class="brand-text">
                        RU Satellite
                    </span>
                </a>

            </div>

        </header>

        <main class="site-main">

            {% block content %}
            {% endblock %}

        </main>

        <footer class="site-footer">

            <p>
                Built for Rutgers students.
            </p>

        </footer>

    </div>

    <script
        src="{{ url_for('static', path='app.js') }}"
        defer
    ></script>

</body>

</html>
