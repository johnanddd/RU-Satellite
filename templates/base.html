<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}RU Satellite{% endblock %}</title>

    <link
        rel="stylesheet"
        href="/static/style.css?v=4"
    >
</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <a href="/" class="brand">
                <span class="brand-icon">🛰️</span>
                <span>RU Satellite</span>
            </a>

        </div>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <script
        src="/static/app.js?v=4"
        defer
    ></script>

</body>
</html>
