{% extends "base.html" %}

{% block title %}RU Satellite{% endblock %}

{% block content %}

<div class="main-card home-card">

    <h1>Rutgers Course Monitoring</h1>

    <p class="subtitle">
        Enter your email to open your watchlist.
        RU Satellite will remember it on this device.
    </p>

    {% if error %}
        <div class="message error-message">
            {{ error }}
        </div>
    {% endif %}

    <form
        action="/dashboard"
        method="post"
        id="email-form"
    >

        <div class="form-group">
            <label for="email">
                Email address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ email or '' }}"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="hidden">
            <label for="website">
                Website
            </label>

            <input
                type="text"
                id="website"
                name="website"
                tabindex="-1"
                autocomplete="off"
            >
        </div>

        <div class="checkbox-row">
            <input
                type="checkbox"
                id="human_check"
                name="human_check"
                value="yes"
                required
            >

            <label for="human_check">
                I am human
            </label>
        </div>

        <button type="submit" class="primary-button full-button">
            Open Dashboard
        </button>

    </form>

    <p class="small-note">
        No account or password required.
    </p>

</div>

{% endblock %}
